# Prometheus Scrape Configuration for local microservice observability
global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: "microservice"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["microservice:8080"]
        labels:
          app: "microservice"
          environment: "local"
