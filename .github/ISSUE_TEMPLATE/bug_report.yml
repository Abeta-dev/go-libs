name: Bug Report
description: Report a bug or unexpected behavior in go-libs
title: "bug: <brief description>"
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug. Please fill out the sections below to help us reproduce and resolve the issue quickly.
  - type: dropdown
    id: package
    attributes:
      label: Affected Package
      description: Select the package where the bug occurs.
      options:
        - apperror
        - bodylimit
        - cache
        - circuitbreaker
        - clock
        - cryptoutil
        - db
        - env
        - ginmw
        - health
        - httpclient
        - httputil
        - idempotency
        - logger
        - maputil
        - metrics
        - pagination
        - ratelimit
        - rbac
        - rbaccontext
        - recovery
        - requestid
        - retry
        - securityheaders
        - shutdown
        - sliceutil
        - stringutil
        - telemetry
        - timeutil
        - validation
        - workerpool
        - other
    validations:
      required: true
  - type: input
    id: go-version
    attributes:
      label: Go Version
      description: Run `go version` and paste the output.
      placeholder: "go version go1.24.0 darwin/arm64"
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal Reproducible Code
      description: Provide a minimal, reproducible code snippet or failing test case.
      render: go
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened? (Include stack traces or error logs if available).
    validations:
      required: true
