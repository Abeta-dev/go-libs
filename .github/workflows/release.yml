name: Release

on:
  push:
    tags:
      - 'v*'

permissions: read-all

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Create or Re-create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          EXISTING_IDS=$(gh api "repos/${{ github.repository }}/releases" --jq ".[] | select(.tag_name == \"$TAG\") | .id" 2>/dev/null || true)
          for REL_ID in $EXISTING_IDS; do
            if [ -n "$REL_ID" ]; then
              echo "Deleting existing release ID $REL_ID for $TAG..."
              gh api -X DELETE "repos/${{ github.repository }}/releases/$REL_ID"
            fi
          done
          echo "Creating fresh release $TAG..."
          gh release create "$TAG" --title "$TAG" --notes-file <(awk '/^## \[/{n++} n==1' CHANGELOG.md)
