name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.1.0)'
        required: false
        default: 'v0.1.0'

permissions: read-all

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Create or Re-create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          EXISTING_IDS=$(gh api "repos/${{ github.repository }}/releases" --jq ".[] | select(.tag_name == \"$TAG\") | .id" 2>/dev/null || true)
          for REL_ID in $EXISTING_IDS; do
            if [ -n "$REL_ID" ]; then
              echo "Deleting existing release ID $REL_ID for $TAG..."
              gh api -X DELETE "repos/${{ github.repository }}/releases/$REL_ID"
            fi
          done
          echo "Creating fresh release $TAG..."
          gh release create "$TAG" --title "$TAG" --notes-file <(awk -v ver="${TAG#v}" 'index($0, "## [" ver "]") == 1 {flag=1; print; next} /^## \[/ {flag=0} flag' CHANGELOG.md)

