name: Nightly Stress & Concurrency Matrix

on:
  schedule:
    - cron: '0 2 * * *' # Every night at 02:00 UTC
  workflow_dispatch:      # Manual trigger

permissions: read-all

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  stress-test:
    name: Race & Concurrency Stress (10 iterations)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@f111f3307d8850f501ac008e886eec1fd1932a34 # v5.3.0
        with:
          go-version: '1.25.x'
          cache: true

      - name: Run High-Concurrency Stress Under Race Detector
        run: |
          echo "Running -race -count=10 on all resilience packages..."
          go test -race -count=10 -v \
            ./circuitbreaker/... \
            ./ratelimit/... \
            ./workerpool/... \
            ./cache/... \
            ./idempotency/... \
            ./shutdown/... \
            ./retry/...
