run:
  modules-download-mode: readonly
  tests: true
output:
  formats:
    - format: colored-line-number
  print-issued-lines: true
  print-linter-name: true
linters:
  disable-all: true
  enable:
    - bodyclose
    - errcheck
    - errorlint
    - gocritic
    - gocyclo
    - gosec
    - govet
    - ineffassign
    - misspell
    - noctx
    - prealloc
    - revive
    - staticcheck
    - unconvert
    - unparam
    - unused
settings:
  errorlint:
    errorf: true
    asserts: true
    comparison: true
  goconst:
    min-len: 3
    min-occurrences: 3
  gocritic:
    disabled-checks:
      - whyNoLint
      - hugeParam
    enabled-tags:
      - diagnostic
      - style
      - performance
  gocyclo:
    min-complexity: 15
  gosec:
    excludes:
      - G104
  govet:
    disable:
      - fieldalignment
      - shadow
    enable-all: true
  prealloc:
    simple: true
    range-loops: true
    for-loops: true
  revive:
    severity: warning
    rules:
      - name: blank-imports
      - name: context-as-argument
      - name: context-keys-type
      - name: dot-imports
      - name: error-return
      - name: error-strings
      - name: error-naming
      - name: if-return
      - name: increment-decrement
      - name: var-naming
      - name: var-declaration
      - name: range
      - name: receiver-naming
      - name: time-naming
      - name: unexported-return
      - name: indent-error-flow
      - name: errorf
      - name: empty-block
      - name: superfluous-else
      - name: unreachable-code
      - name: redefines-builtin-id
      - name: unused-parameter
        disabled: true
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  exclude-rules:
    - path: _test\.go
      linters:
        - bodyclose
        - errcheck
        - gocritic
        - gocyclo
        - gosec
        - noctx
        - unparam
        - revive
    - path: examples/.*
      linters:
        - gocyclo
        - gocritic
        - revive
